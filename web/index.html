<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergeye</title>
    <meta name="description" content="Serviço em Go que revisa MRs e PRs com IA e comenta direto no GitLab, no GitHub e no Gitea." />
    <meta property="og:title" content="Mergeye" />
    <meta property="og:description" content="Serviço em Go que revisa MRs e PRs com IA e comenta direto no GitLab, no GitHub e no Gitea." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reviewer.pauloholanda.com.br/" />
    <meta property="og:image" content="https://raw.githubusercontent.com/PauloFH/code-reviewer/main/.portfolio/capa.png" />
    <!-- Data URI porque dist/ só versiona o index.html. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Cpath d='M2 16Q16 4 30 16' stroke='%23ff4d3d' stroke-width='3'/%3E%3Cpath d='M2 16Q16 28 30 16' stroke='%231fd97c' stroke-width='3'/%3E%3Crect x='12' y='12' width='8' height='8' fill='%23ffc917'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    </style>
    <script>
      // Aplica o tema salvo antes do Vue montar, sem piscar. Só "light" gera atributo; erro de storage mantém o escuro.
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
