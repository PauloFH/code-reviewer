services:
  code-reviewer:
    build:
      context: .
      secrets:
        - git_token
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./clients.json:/app/clients.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  # Token de leitura do Gitea para baixar o SDK privado durante o build.
  # Lido da variável CI_GIT_TOKEN do ambiente do host; não vai para a imagem.
  git_token:
    environment: CI_GIT_TOKEN
