name: CI/CD

on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # The Go module git.pauloholanda.com.br/paulorh/sdk-claude-oauth-go is
      # private: GOPRIVATE tells Go to skip the public proxy/checksum DB for it.
      GOPRIVATE: git.pauloholanda.com.br/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Authenticate to the private module host so `go` can fetch the SDK.
      # Requires a Gitea secret CI_GIT_TOKEN with read access to the SDK repo.
      - name: Configure private module access
        run: |
          git config --global url."https://${{ secrets.CI_GIT_TOKEN }}@git.pauloholanda.com.br/".insteadOf "https://git.pauloholanda.com.br/"

      # Go lint
      # install-mode goinstall compiles golangci-lint with the project's Go
      # toolchain (from go.mod), so its targeted-version check matches. The
      # prebuilt binary is built with an older Go and rejects newer go.mod targets.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall

      # Go vulnerability check
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Go tests
      - name: Go tests
        run: go test ./...

      # Frontend
      - name: Frontend install
        run: cd web && npm ci

      - name: Frontend lint
        run: cd web && npm run lint

      - name: Frontend type-check
        run: cd web && npm run type-check

      # Build verification
      - name: Go build
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/server

      - name: Frontend build
        run: cd web && npm run build

  deploy:
    needs: lint-and-test
    runs-on: deploy-code-reviewer
    steps:
      - name: Deploy
        run: |
          cd /opt/code-reviewer
          git pull
          cd web
          npm ci
          npm run build
          cd /opt/code-reviewer
          CGO_ENABLED=1 go build -ldflags="-s -w" -o code-reviewer ./cmd/server
          sudo systemctl restart code-reviewer
