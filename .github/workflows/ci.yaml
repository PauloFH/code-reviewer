name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo cancela a execução anterior; assim um CI antigo não termina depois do novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    runs-on: ubuntu-latest
    env:
      # The Go module git.pauloholanda.com.br/paulorh/sdk-claude-oauth-go is
      # private: GOPRIVATE tells Go to skip the public proxy/checksum DB for it.
      GOPRIVATE: git.pauloholanda.com.br/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Latest patch of the 1.26 series (>= 1.26.10 fixes GO-2026-6617 in
          # net/http and GO-2026-6809 in crypto/x509). check-latest forces fetching the newest 1.26.x instead of
          # reusing an older cached patch on the runner, keeping stdlib security
          # fixes current so govulncheck passes.
          go-version: '1.26.x'
          check-latest: true
          # O cache conteria o código do SDK privado, e PRs de fork leem o cache do branch base.
          cache: false

      # Authenticate to the private module host so `go` can fetch the SDK.
      # Requires a secret CI_GIT_TOKEN with read access to the SDK repo on Gitea.
      - name: Configure private module access
        env:
          CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          if [ -z "$CI_GIT_TOKEN" ]; then
            echo "::error::secret CI_GIT_TOKEN is empty or not set — create it in the repo's Actions secrets with read access to the SDK repo"
            exit 1
          fi
          git config --global url."https://${CI_GIT_TOKEN}@git.pauloholanda.com.br/".insteadOf "https://git.pauloholanda.com.br/"

      # Pre-fetch modules with credentials in place. Populates the module cache
      # for golangci-lint/test/build and surfaces a clear download/auth error
      # instead of golangci-lint's cryptic "no export data".
      - name: Download Go modules
        run: go mod download

      # Go lint
      # install-mode goinstall compiles golangci-lint with the project's Go
      # toolchain (from go.mod), so its targeted-version check matches. The
      # prebuilt binary is built with an older Go and rejects newer go.mod targets.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          skip-cache: true

      # Go vulnerability check
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Deploy script test
        run: bash deploy/deploy_test.sh

  go-test-arm:
    runs-on: ubuntu-24.04-arm
    env:
      GOPRIVATE: git.pauloholanda.com.br/*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      - name: Configure private module access
        env:
          CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
        run: |
          if [ -z "$CI_GIT_TOKEN" ]; then
            echo "::error::secret CI_GIT_TOKEN is empty or not set"
            exit 1
          fi
          git config --global url."https://${CI_GIT_TOKEN}@git.pauloholanda.com.br/".insteadOf "https://git.pauloholanda.com.br/"

      - name: Go tests
        run: go test ./...

      - name: Go build
        run: CGO_ENABLED=1 go build -o /dev/null ./cmd/server

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend install
        run: cd web && npm ci

      - name: Frontend lint
        run: cd web && npm run lint

      - name: Frontend type-check
        run: cd web && npm run type-check

      - name: Frontend build
        run: cd web && npm run build

  # Compila aqui para o servidor não precisar de token, Go, Node nem rodar o build do commit.
  # Sem a chave de deploy: o código do commit roda neste job e não pode alcançá-la.
  build:
    needs: [go-quality, go-test-arm, frontend]
    # Mesmo Ubuntu e arquitetura do servidor; ARM usa BUILD_RUNNER=ubuntu-24.04-arm.
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    outputs:
      checksum: ${{ steps.package.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: cd web && npm ci --ignore-scripts && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      # Helper com reset: o token não vai para ps nem para ~/.gitconfig.
      - name: Build binary
        env:
          CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
          GOPRIVATE: git.pauloholanda.com.br/*
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: credential.https://git.pauloholanda.com.br.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.https://git.pauloholanda.com.br.helper
          GIT_CONFIG_VALUE_1: '!f() { test "$1" = get && printf "username=oauth2\npassword=%s\n" "$CI_GIT_TOKEN"; }; f'
        run: CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o code-reviewer ./cmd/server

      # Artefato de repositório público é baixável por qualquer pessoa logada, e o binário contém o SDK privado.
      - name: Encrypt binary
        id: package
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          if [ -z "$ARTIFACT_KEY" ]; then
            echo "::error::secret ARTIFACT_KEY is empty or not set"
            exit 1
          fi
          echo "checksum=$(sha256sum code-reviewer | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -in code-reviewer -out code-reviewer.enc

      - uses: actions/upload-artifact@v4
        with:
          name: code-reviewer
          path: code-reviewer.enc
          retention-days: 1
          if-no-files-found: error

  # Espera a aprovação do ambiente production. Sem checkout: nenhum código do commit roda perto da chave.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: code-reviewer

      # A chave só executa deploy/code-reviewer-deploy.sh (forced command); ver docs/deployment.md.
      - name: Deploy via SSH
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          for name in ARTIFACT_KEY CHECKSUM DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_TARGET DEPLOY_PORT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not set"
              exit 1
            fi
          done
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ARTIFACT_KEY -in code-reviewer.enc -out "$RUNNER_TEMP/code-reviewer"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ServerAliveInterval=30 \
            "$DEPLOY_TARGET" "$GITHUB_SHA $CHECKSUM" < "$RUNNER_TEMP/code-reviewer"
